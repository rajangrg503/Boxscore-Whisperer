# Keep the live app awake.
#
# Streamlit Community Cloud puts an app to sleep after a stretch with no
# visitors, and a sleeping app can hang on "Your app is in the oven" for
# anyone who already had it open (1 Nov 2026). This opens the app in a
# real headless browser every four hours -- a browser session is what
# counts as traffic; a plain curl does not -- and presses the wake-up
# button if it finds the sleep page.
#
# A red run means the app did not come up within five minutes. GitHub
# emails the repo owner on a failed scheduled run, so that is the alert.
#
# Free: Actions minutes cost nothing on a public repository. GitHub
# pauses scheduled workflows on a repo with no commits for 60 days; if
# that ever happens, re-enable it from the Actions tab.
name: Keep app awake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Visit the app
        run: python tools/keep_awake.py
